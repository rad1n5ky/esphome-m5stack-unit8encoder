# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: $device_name
  friendly_name: $friendly_name

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

external_components:
  - source: github://rad1n5ky/esphome-m5stack-unit8encoder
    components: [m5stack_unit8encoder]

logger:
  #level: DEBUG # Uncomment this line for more verbose logging

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
    #sda: GPIO2
    #scl: GPIO1
    
    #AtomicPortABC
    sda: GPIO38
    scl: GPIO39  
    scan: true 
    frequency: 100kHz
    timeout: 200ms
  
m5stack_unit8encoder:
  - id: unit8encoder

binary_sensor:
  - platform: m5stack_unit8encoder
    m5stack_unit8encoder_id: unit8encoder
    switch:
      id: enc8_switch
      name: "Enc8 Toggle Switch"
    button_1:
      id: button_1
      name: "Enc8 Button 1"
    button_2:
      id: button_2
      name: "Enc8 Button 2"
    button_3:
      id: button_3
      name: "Enc8 Button 3"
    button_4:
      id: button_4
      name: "Enc8 Button 4"
    button_5:
      id: button_5
      name: "Enc8 Button 5"
    button_6:
      id: button_6
      name: "Enc8 Button 6"
    button_7:
      id: button_7
      name: "Enc8 Button 7"
    button_8:
