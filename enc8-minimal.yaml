    encoder_2:
      id: delta_2
      name: "Enc8 Encoder 2"
    encoder_3:
      id: delta_3
      name: "Enc8 Encoder 3"
    encoder_4:
      id: delta_4
      name: "Enc8 Encoder 4"
    encoder_5:
      id: delta_5
      name: "Enc8 Encoder 5"
    encoder_6:
      id: delta_6
      name: "Enc8 Encoder 6"
    encoder_7:
